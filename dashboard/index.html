<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Status</title>
<script>
  try {
    var saved = localStorage.getItem('project-status:theme');
    document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  } catch (_) {
    document.documentElement.dataset.theme = 'dark';
  }
</script>
<link rel="stylesheet" href="vendor/phosphor/regular.css">
<link rel="stylesheet" href="vendor/phosphor/bold.css">
<link rel="stylesheet" href="vendor/phosphor/fill.css">
<link rel="stylesheet" href="styles.css">
</head>

<script src="app.js"></script>
</body>
</html>
